<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Freak Blocks</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org"></script>
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <div id="title">FREAK BLOCKS</div>
            <div id="score-box">ОЧКИ<br><span id="score">0</span></div>
        </div>

        <div class="tabs">
            <button id="btn-game" class="tab-btn active">🎮 ИГРАТЬ</button>
            <button id="btn-leaderboard" class="tab-btn">🏆 ТОП ИГРОКОВ</button>
        </div>

        <!-- Игровое окно -->
        <div id="tab-game" class="tab-content">
            <div id="grid-container">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div id="tile-layer"></div>
            </div>
            <button id="restart-btn">НАЧАТЬ ЗАНОВО</button>
        </div>

        <!-- Окно общего Лидерборда -->
        <div id="tab-leaderboard" class="tab-content hidden">
            <div id="leaderboard-list">
                <div class="loading">Загрузка глобального топа...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
