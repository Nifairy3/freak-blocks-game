<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Freak Blocks</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org"></script>
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <div id="title">FREAK BLOCKS</div>
            <div id="score-box">ОЧКИ<br><span id="score">0</span></div>
        </div>

        <div class="tabs">
            <button id="btn-game" class="tab-btn active">🎮 ИГРАТЬ</button>
            <button id="btn-leaderboard" class="tab-btn">🏆 ТОП ИГРОКОВ</button>
        </div>

        <!-- Игровое окно -->
        <div id="tab-game" class="tab-content">
            <div id="grid-container">
                <!-- Задаем ID каждой ячейке от 0 до 15 -->
                <div class="grid-cell" id="c-0"></div><div class="grid-cell" id="c-1"></div><div class="grid-cell" id="c-2"></div><div class="grid-cell" id="c-3"></div>
                <div class="grid-cell" id="c-4"></div><div class="grid-cell" id="c-5"></div><div class="grid-cell" id="c-6"></div><div class="grid-cell" id="c-7"></div>
                <div class="grid-cell" id="c-8"></div><div class="grid-cell" id="c-9"></div><div class="grid-cell" id="c-10"></div><div class="grid-cell" id="c-11"></div>
                <div class="grid-cell" id="c-12"></div><div class="grid-cell" id="c-13"></div><div class="grid-cell" id="c-14"></div><div class="grid-cell" id="c-15"></div>
            </div>
            <button id="restart-btn">НАЧАТЬ ЗАНОВО</button>
        </div>

        <!-- Окно общего Лидерборда -->
        <div id="tab-leaderboard" class="tab-content hidden">
            <div id="leaderboard-list">
                <div class="loading">Локальный топ временно пуст</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
